
<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="'Orbitron','Rajdhani','SFMono-Regular',Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030918"/>
      <stop offset="48%" stop-color="#07152a"/>
      <stop offset="100%" stop-color="#020612"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#103f76" stop-opacity=".66"/>
      <stop offset="60%" stop-color="#071224" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#00030b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081b34" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#030a16" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21ccff" stop-opacity="0"/>
      <stop offset="37%" stop-color="#21ccff" stop-opacity=".18"/>
      <stop offset="48%" stop-color="#d9f8ff" stop-opacity="1"/>
      <stop offset="54%" stop-color="#28c8ff" stop-opacity="1"/>
      <stop offset="68%" stop-color="#28c8ff" stop-opacity=".25"/>
      <stop offset="100%" stop-color="#28c8ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#23bfff" stroke-opacity=".08" stroke-width=".6"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="cardClip"><rect x="20" y="46" width="860" height="322" rx="10"/></clipPath>
    <clipPath id="leftBoxClip"><rect x="25" y="78" width="350" height="282" rx="6"/></clipPath>
    
    <style>
      .tiny { fill:#4fbfe8; font-size:8px; letter-spacing:1.5px; }
      .path { fill:#82aac3; font-size:11px; letter-spacing:.6px; }
      .label { fill:#43d1ff; font-size:11.5px; letter-spacing:.6px; font-weight:700; }
      .value { fill:#d5efff; font-size:11.5px; }
      .section { fill:#9feaff; font-size:11px; font-weight:700; letter-spacing:1.4px; }
      .header { fill:#5be0ff; font-size:11px; font-weight:700; letter-spacing:2px; }
      .name { fill:#fff; font-size:18px; font-weight:700; letter-spacing:1px; }
      .reveal { opacity:0; animation:reveal .42s ease-out forwards; }
      @keyframes reveal { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
      @keyframes flicker { 0%,92%,100%{opacity:1}94%{opacity:.72}96%{opacity:.95} }
      .hud { animation:flicker 4s infinite; }
      
      .main-ui { opacity: 0; animation: uiAppear .6s 2.2s ease-out forwards; }
      @keyframes uiAppear { from { opacity: 0; } to { opacity: 1; } }
      
      .intro-screen { animation: hideIntro .4s 2.2s forwards; }
      @keyframes hideIntro { to { opacity: 0; visibility: hidden; } }
      
      .intro-text { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; font-family: 'SFMono-Regular', Consolas, monospace; }
      .typing-1 { opacity: 0; animation: step1 2.2s forwards; fill: #4fbfe8; }
      .typing-2 { opacity: 0; animation: step2 2.2s forwards; fill: #4fbfe8; }
      .typing-3 { opacity: 0; animation: step3 2.2s forwards; fill: #21e5a3; }
      
      @keyframes step1 { 0% { opacity:0; } 5% { opacity:1; } 100% { opacity:1; } }
      @keyframes step2 { 0%, 30% { opacity:0; } 35% { opacity:1; } 100% { opacity:1; } }
      @keyframes step3 { 0%, 65% { opacity:0; } 70% { opacity:1; } 100% { opacity:1; } }
      
      .blink { animation: blinker 0.8s step-start infinite; }
      @keyframes blinker { 50% { opacity: 0; } }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="400" rx="14" fill="url(#bg)"/>
  <rect width="900" height="400" rx="14" fill="url(#orb)"/>
  <rect x="1" y="1" width="898" height="398" rx="13" fill="none" stroke="#177eac" stroke-opacity=".7"/>
  <rect x="0" y="0" width="900" height="400" rx="14" fill="url(#grid)" opacity=".45"/>

  <!-- Futuristic Titlebar -->
  <path d="M0 14Q0 0 14 0H886Q900 0 900 14V36H0Z" fill="#071426" stroke="#176a9d" stroke-opacity=".8"/>
  <path d="M18 35H882" stroke="#26c7ff" stroke-opacity=".35"/>
  <circle cx="22" cy="18" r="5" fill="#ff4e7a"/><circle cx="40" cy="18" r="5" fill="#ffca4c"/><circle cx="58" cy="18" r="5" fill="#21e5a3"/>
  <text x="85" y="22" class="tiny">HEN.MALIANKER // NEURAL_PROFILE</text>
  <text x="856" y="22" text-anchor="end" class="tiny hud">SYS: ONLINE</text>

  <!-- INTRO BOOT SCREEN -->
  <g class="intro-screen">
    <text x="50" y="140" class="intro-text typing-1">>_ ESTABLISHING SECURE CONNECTION...</text>
    <text x="50" y="180" class="intro-text typing-2">>_ AUTHENTICATING ID: 0xH3N...</text>
    <text x="50" y="220" class="intro-text typing-3">>_ ACCESS GRANTED. LOADING PROFILE<tspan class="blink">_</tspan></text>
  </g>

  <!-- MAIN UI (Fades in after 2.2s together with the GIF) -->
  <g class="main-ui">
    <rect x="20" y="47" width="360" height="320" rx="10" fill="url(#panel)" stroke="#167aa8" stroke-opacity=".65"/>
    <rect x="397" y="47" width="483" height="320" rx="10" fill="url(#panel)" stroke="#167aa8" stroke-opacity=".65"/>
    <path d="M20 76H380M397 76H880" stroke="#27cbff" stroke-opacity=".42"/>
    <path d="M25 52h23M20 52v23M352 362h23M375 339v23M402 52h23M402 52v23M852 362h23M875 339v23" fill="none" stroke="#3ad3ff" stroke-width="1.4"/>

    <text x="35" y="66" class="header">VISUAL.MAP / AVATAR-SCAN</text>
    <text x="365" y="66" text-anchor="end" class="tiny">LIVE_FEED</text>
    
    <!-- Embedded GIF natively inside the left box -->
    <g clip-path="url(#leftBoxClip)">
      <image href="scan.gif" x="35" y="85" width="330" height="270" preserveAspectRatio="xMidYMid slice"/>
    </g>

    <!-- Information Panel -->
    <g class="reveal" style="animation-delay:2.65s">
      <text x="422" y="68" class="tiny">PROFILE // 01</text>
      <text x="422" y="93" class="name">HEN MALIANKER</text>
    </g>
    <g class="reveal" style="animation-delay:2.92s">
      <text x="422" y="125" class="label">STATUS</text>
      <text x="510" y="125" class="value">B.Sc. CS Student @ SCE (AI Track)</text>
      <text x="422" y="152" class="label">LOCATION</text>
      <text x="510" y="152" class="value">Israel</text>
      <path d="M422 168H855" stroke="#1a587b" stroke-dasharray="3 4"/>
    </g>
    <g class="reveal" style="animation-delay:3.19s">
      <text x="422" y="193" class="section">[ LOADOUT / TECH STACK ]</text>
      <text x="422" y="215" class="label">CODE</text>
      <text x="510" y="215" class="value">Python · Java · C++ · C · x86 ASM</text>
      <text x="422" y="237" class="label">TOOLS</text>
      <text x="510" y="237" class="value">Linux · Git · VS Code · PyCharm · Colab</text>
      <path d="M422 253H855" stroke="#1a587b" stroke-dasharray="3 4"/>
    </g>
    <g class="reveal" style="animation-delay:3.46s">
      <text x="422" y="278" class="section">[ ACTIVE MISSION ]</text>
      <text x="422" y="300" class="label">FOCUS</text>
      <text x="510" y="300" class="value">Artificial Intelligence / Machine Learning</text>
      <text x="422" y="322" class="label">PROJECT</text>
      <text x="510" y="322" class="value">Defensive Drone Interception System</text>
      <path d="M422 338H855" stroke="#1a587b" stroke-dasharray="3 4"/>
    </g>
    <g class="reveal" style="animation-delay:3.73s">
      <text x="422" y="358" class="label">EMAIL</text>
      <text x="460" y="358" class="value">hen88275@gmail.com</text>
      <text x="590" y="358" class="label">LINKEDIN</text>
      <text x="650" y="358" class="value">www.linkedin.com/in/hen-malianker</text>
    </g>

    <!-- Scanner Animation -->
    <g clip-path="url(#cardClip)">
      <rect x="20" y="44" width="860" height="20" fill="#20c8ff" opacity="0" filter="url(#softGlow)">
        <animate attributeName="y" from="42" to="360" begin="2.6s" dur="2.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0;0.18;0.18;0" keyTimes="0;0.1;0.9;1" begin="2.6s" dur="2.5s" fill="freeze"/>
      </rect>
      <rect x="20" y="44" width="860" height="4" fill="url(#scanGrad)" opacity="0" filter="url(#glow)">
        <animate attributeName="y" from="42" to="360" begin="2.6s" dur="2.5s" fill="freeze"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" begin="2.6s" dur="2.5s" fill="freeze"/>
      </rect>
      <rect x="20" y="46" width="860" height="322" fill="none" stroke="#33d2ff" stroke-opacity=".3" opacity="0.1">
        <animate attributeName="opacity" values=".1;.4;.1" begin="2.6s" dur="2.5s" fill="freeze"/>
      </rect>
    </g>
  </g>
</svg>
